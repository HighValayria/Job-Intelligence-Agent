[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-intelligence-agent"
version = "0.1.0"
description = "Mock-first job intelligence collection and structuring pipeline."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
py-modules = ["main", "config_loader", "pipeline_errors"]
packages = [
    "collectors",
    "models",
    "processing",
    "llm",
    "validation",
    "dedup",
    "storage",
    "exporters",
    "scheduler",
    "annotation",
    "normalization",
    "evaluation",
    "inspection",
]
